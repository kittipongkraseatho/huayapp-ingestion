# Railway deployment config for the Huayapp ingestion API.
#
# Deploy steps (run on a machine that has `railway` CLI installed and is
# already authenticated to https://railway.app):
#
#   1. cd C:\Users\kittiphong.k\Documents\Default Project\big
#   2. railway login
#   3. railway link                       # pick or create a project
#   4. railway up                         # build + deploy from this directory
#
# After the first deploy, set the required env vars from the Railway
# dashboard (or via `railway variables set ...`). Required:
#
#   DATABASE_URL           postgres://user:pass@host:5432/dbname
#   SCRAPE_API_KEY         any long random value (32+ bytes)
#   ALLOWED_DOMAINS        https://lotto-89ad0.web.app
#   CORS_ORIGINS           https://lotto-89ad0.web.app
#   REFRESH_INTERVAL_SECONDS 900
#
# Railway's "Variables" tab on the service lets you paste the values
# above; DATABASE_URL comes from the Postgres plugin if you add one.

[build]
# Build the API image from the root Dockerfile. This pulls the same
# huayapp_scraper package the CLI uses, plus FastAPI + uvicorn.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"

[deploy]
# Long-running web process — Railway expects a process that keeps
# listening on the port it advertises.
startCommand = "uvicorn huayapp_api.app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Make sure Railway runs the periodic refresh loop too — the in-process
# lifespan already handles that. Just expose the interval here so it is
# visible from the service page.
[env]
REFRESH_INTERVAL_SECONDS = { default = "900" }
PYTHONUNBUFFERED = { default = "1" }